name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.py
            **/*.vue
            **/*.js
            **/*.ts
            **/*.json

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > changes.diff
          cat changes.diff

      - name: Run Claude Code Review
        id: review
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            
            const diff = fs.readFileSync('changes.diff', 'utf8');
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split('\n').filter(f => f);
            
            // Limit diff to first 50KB to avoid token limits
            const limitedDiff = diff.substring(0, 50000);
            
            const reviewPrompt = `You are an expert code reviewer. Review the following code changes and provide constructive feedback.

Changed Files: ${changedFiles.join(', ')}
PR Title: ${{ env.PR_TITLE }}
PR Description: ${{ env.PR_BODY }}

Code Changes:
\`\`\`diff
${limitedDiff}
\`\`\`

Please provide a brief code review with:
1. Any bugs or issues found
2. Performance concerns
3. Best practice violations
4. Positive observations
5. Specific suggestions for improvement

Format as markdown. Be concise but thorough.`;

            const payload = JSON.stringify({
              model: 'claude-3-5-sonnet-20241022',
              max_tokens: 1024,
              messages: [
                {
                  role: 'user',
                  content: reviewPrompt
                }
              ]
            });

            return new Promise((resolve, reject) => {
              const req = https.request('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01'
                }
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const response = JSON.parse(data);
                    if (response.content && response.content[0]) {
                      resolve(response.content[0].text);
                    } else {
                      reject(new Error('No content in response'));
                    }
                  } catch (e) {
                    reject(e);
                  }
                });
              });

              req.on('error', reject);
              req.write(payload);
              req.end();
            });

      - name: Post review comment
        if: steps.review.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.review.outputs.result }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 Claude Code Review\n\n' + review
            });

      - name: Report failure
        if: failure() && steps.review.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Claude Code Review failed to run. Please check the workflow logs.'
            });
